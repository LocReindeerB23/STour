spring.application.name=tour-booking
# Cấu hình kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tour_booking_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=abc123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Cấu hình Hibernate (update để tự đồng bộ bảng, không bao giờ xóa dữ liệu)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
# (Tuỳ chọn) Tắt H2 console nếu không dùng nữa
spring.h2.console.enabled=false

# Cấu hình upload file (tăng giới hạn kích thước)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

