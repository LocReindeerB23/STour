<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi Thanh Toán - Tuấn Vi Vu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0ea5e9; --dark: #0f172a; --light: #f8fafc; --error: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--light); color: var(--dark); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
        
        .error-card { background: white; padding: 3rem; border-radius: 24px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.1); max-width: 500px; width: 100%; text-align: center; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid #f1f5f9; }
        
        @keyframes slideUp { from {opacity: 0; transform: translateY(40px);} to {opacity: 1; transform: translateY(0);} }
        
        .icon-circle { width: 90px; height: 90px; background: #fee2e2; color: var(--error); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 1.5rem; }
        
        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 1rem; color: var(--dark); }
        p.subtitle { color: #64748b; margin-bottom: 2.5rem; font-size: 1.1rem; line-height: 1.6; }

        .btn { display: inline-block; padding: 14px 35px; background: var(--error); color: white; border-radius: 50px; font-weight: 700; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); margin-bottom: 10px; width: 100%; border: none; cursor: pointer; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4); }
        
        .btn-outline { background: transparent; color: #64748b; border: 2px solid #cbd5e1; box-shadow: none; }
        .btn-outline:hover { background: #f8fafc; color: var(--dark); border-color: #94a3b8; box-shadow: none; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="icon-circle"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h1>Lỗi Thanh Toán!</h1>
        <p class="subtitle">Rất tiếc, đã có lỗi xảy ra trong quá trình xử lý giao dịch. Vui lòng thử lại sau hoặc liên hệ bộ phận hỗ trợ của chúng tôi để được giải đáp.</p>
        
        <button onclick="window.history.back()" class="btn">Thử lại giao dịch</button>
        <a href="/tours" class="btn btn-outline" style="display: block; margin-top: 5px;">Quay Về Trang Chủ</a>
    </div>

</body>
</html>
