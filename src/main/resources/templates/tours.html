<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Tour - Tuấn Vi Vu</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .tour-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .tour-card:hover { transform: translateY(-5px); box-shadow: 0 1rem 3rem rgba(0,0,0,.15)!important; }
        .card-img-top { height: 220px; object-fit: cover; }
        .price-text { font-size: 1.4rem; font-weight: 800; color: #0ea5e9; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="/"><i class="fa-solid fa-plane-departure me-2"></i>Tuấn Vi Vu</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link fw-medium" href="/">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link active fw-medium" href="/tours">Khám phá</a></li>
        
        <li class="nav-item" th:if="${session.user != null}">
            <a class="nav-link fw-medium" href="/my-bookings">Chuyến đi của tôi</a>
        </li>
        
        <li class="nav-item ms-lg-3" th:if="${session.user == null}">
            <a class="btn btn-outline-primary rounded-pill px-4 me-2" href="/register">Đăng ký</a>
            <a class="btn btn-primary rounded-pill px-4" href="/login">Đăng nhập</a>
        </li>
        
        <li class="nav-item dropdown ms-lg-3" th:if="${session.user != null}">
            <a class="nav-link dropdown-toggle fw-bold text-dark" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                <i class="fa-solid fa-circle-user me-1 text-primary"></i> <span th:text="${session.user.fullName}"></span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                <li><a class="dropdown-item fw-medium" href="/profile"><i class="fa-solid fa-user me-2"></i>Hồ sơ của tôi</a></li>
                <li><a class="dropdown-item text-danger fw-medium" href="/logout"><i class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất</a></li>
            </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
    
    <!-- Search Bar -->
    <div class="card shadow-sm border-0 rounded-4 mb-5 p-3">
        <div class="card-body">
            <form action="/tours" method="get" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-bold text-muted small"><i class="fa-solid fa-location-dot me-1"></i>Địa điểm</label>
                    <input type="text" class="form-control" name="destination" th:value="${destination}" placeholder="Bạn muốn đi đâu?">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-muted small"><i class="fa-solid fa-layer-group me-1"></i>Thể loại</label>
                    <select class="form-select" name="category">
                        <option value="">Tất cả</option>
                        <option value="Biển" th:selected="${category == 'Biển'}">Biển</option>
                        <option value="Núi" th:selected="${category == 'Núi'}">Núi</option>
                        <option value="Nghỉ dưỡng" th:selected="${category == 'Nghỉ dưỡng'}">Nghỉ dưỡng</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold text-muted small"><i class="fa-solid fa-money-bill me-1"></i>Giá từ</label>
                    <input type="number" class="form-control" name="minPrice" th:value="${minPrice}" placeholder="VNĐ">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold text-muted small"><i class="fa-solid fa-money-bill me-1"></i>Giá đến</label>
                    <input type="number" class="form-control" name="maxPrice" th:value="${maxPrice}" placeholder="VNĐ">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100 fw-bold"><i class="fa-solid fa-magnifying-glass me-2"></i>Tìm kiếm</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${tours.empty}" class="text-center py-5">
        <i class="fa-regular fa-face-frown display-1 text-muted mb-3"></i>
        <h3 class="fw-bold">Không tìm thấy tour nào phù hợp!</h3>
        <p class="text-muted">Vui lòng thử lại với các tiêu chí tìm kiếm khác.</p>
    </div>

    <!-- Tour Grid -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:unless="${tours.empty}">
        
        <!-- Tour Item -->
        <div class="col" th:each="tour : ${tours}">
            <div class="card h-100 shadow-sm border-0 rounded-4 tour-card overflow-hidden">
                <div class="position-relative">
                    <img th:src="${tour.imageUrl != null ? tour.imageUrl : 'https://images.unsplash.com/photo-1528181304800-259b08848526?q=80&w=600&auto=format&fit=crop&sig=' + tour.id}" class="card-img-top" alt="Tour Image">
                    <span class="badge bg-primary position-absolute top-0 end-0 m-3 px-3 py-2 rounded-pill shadow-sm" th:text="${tour.category}">Category</span>
                </div>
                <div class="card-body d-flex flex-column p-4">
                    <div class="text-primary fw-bold text-uppercase small mb-2"><i class="fa-solid fa-location-dot me-1"></i><span th:text="${tour.destination != null ? tour.destination : 'Điểm đến thú vị'}"></span></div>
                    <h5 class="card-title fw-bold mb-3" th:text="${tour.name}">Tên Tour</h5>
                    
                    <div class="mb-4 text-muted small">
                        <div class="mb-2"><i class="fa-regular fa-calendar me-2"></i>Khởi hành: <b class="text-dark" th:text="${tour.departureDate}"></b></div>
                        <div><i class="fa-solid fa-user-group me-2"></i>Còn trống: <b class="text-dark" th:text="${tour.stockAdult}"></b> chỗ</div>
                    </div>
                    
                    <div class="mt-auto d-flex justify-content-between align-items-end pt-3 border-top">
                        <div>
                            <span class="text-muted small d-block mb-1">Chỉ từ</span>
                            <span class="price-text" th:text="${#numbers.formatDecimal(tour.priceAdult, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
                        </div>
                        <a th:href="@{/tours/{id}(id=${tour.id})}" class="btn btn-outline-primary rounded-pill px-4 fw-medium">Chi tiết</a>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
