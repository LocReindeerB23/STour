<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môi trường Giả lập Thanh Toán - Tuấn Vi Vu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --dark: #0f172a; --light: #f8fafc; --success: #10b981; --error: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f1f5f9; color: var(--dark); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
        
        .mock-card { background: white; padding: 3rem; border-radius: 24px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.1); max-width: 500px; width: 100%; text-align: center; border: 1px solid #e2e8f0; }
        
        .icon-circle { width: 80px; height: 80px; background: #e0e7ff; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.5rem; }
        
        h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--dark); }
        p.subtitle { color: #64748b; margin-bottom: 2rem; font-size: 1rem; line-height: 1.5; }

        .btn { display: inline-block; padding: 14px 20px; color: white; border-radius: 12px; font-weight: 700; text-decoration: none; transition: all 0.2s; margin-bottom: 15px; width: 100%; cursor: pointer; border: none; font-size: 1rem; }
        
        .btn-success { background: var(--success); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4); }
        
        .btn-cancel { background: white; color: var(--error); border: 2px solid #fca5a5; }
        .btn-cancel:hover { background: #fef2f2; transform: translateY(-2px); border-color: var(--error); }
        
        .badge { display: inline-block; background: #e2e8f0; color: #475569; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="mock-card">
        <span class="badge">Môi trường Kiểm thử (Testing)</span>
        <div class="icon-circle"><i class="fa-brands fa-stripe-s"></i></div>
        <h1>Giả Lập Thanh Toán Stripe</h1>
        <p class="subtitle">Hệ thống đang chạy ở chế độ giả lập (Mock Mode) vì chưa cấu hình Stripe API Key thật.<br>Vui lòng chọn kết quả giao dịch giả định cho mã đơn hàng <b th:text="${orderCode}"></b>.</p>
        
        <form action="/payment/success" method="GET" style="margin-bottom: 0;">
            <input type="hidden" name="orderCode" th:value="${orderCode}" />
            <button type="submit" class="btn btn-success">
                <i class="fa-solid fa-check-circle" style="margin-right: 5px;"></i> Giả lập Thanh Toán Thành Công
            </button>
        </form>

        <a href="/payment/cancel" class="btn btn-cancel">
            <i class="fa-solid fa-xmark" style="margin-right: 5px;"></i> Giả lập Huỷ Giao Dịch
        </a>
    </div>

</body>
</html>
