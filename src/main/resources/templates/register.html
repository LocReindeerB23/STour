<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Tuấn Vi Vu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0ea5e9; --primary-hover: #0284c7; --dark: #0f172a; --light: #f8fafc; --gray: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--light); color: var(--dark); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
        
        .auth-card { background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); width: 100%; max-width: 450px; }
        h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; text-align: center; }
        p.subtitle { text-align: center; color: var(--gray); margin-bottom: 2rem; font-size: 0.95rem; }
        
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 500; margin-bottom: 0.5rem; font-size: 0.95rem; color: var(--gray); }
        input { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; transition: all 0.3s; outline: none; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2); }
        
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1.05rem; cursor: pointer; transition: all 0.3s; margin-top: 1rem; }
        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3); }
        
        .error { color: #dc2626; background: #fee2e2; padding: 10px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 1rem; text-align: center; }
        
        .bottom-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--gray); }
        .bottom-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet"/>
    <link th:href="@{/assets/css/style.css}" rel="stylesheet"/>

</head>
<body>

    <div class="auth-card">
        <h2>Tạo Tài Khoản Mới ✨</h2>
        <p class="subtitle">Trở thành thành viên của Tuấn Vi Vu</p>

        <div th:if="${error}" class="error" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label>Họ và Tên</label>
                <input type="text" name="fullName" required pattern="[a-zA-ZÀ-ỹ\s]+" placeholder="Nguyễn Văn A" oninvalid="this.setCustomValidity(this.value === '' ? 'Họ tên không được để trống' : 'Họ tên chỉ được chứa chữ cái')" oninput="this.setCustomValidity('')">
            </div>
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" name="phone" required pattern="[0-9]{10}" placeholder="09xxxxxx" oninvalid="this.setCustomValidity(this.value === '' ? 'Số điện thoại không được để trống' : 'số điện thoại không hợp lệ')" oninput="this.setCustomValidity('')">
            </div>
            <div class="form-group">
                <label>Email</label>
                <!-- Cố tình dùng type="text" và bỏ pattern để tạo lỗi cho Test Case -->
                <input type="text" name="email" required placeholder="nhap@email.com" oninvalid="this.setCustomValidity('Email không được để trống')" oninput="this.setCustomValidity('')">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" name="password" required placeholder="••••••••" oninvalid="this.setCustomValidity('Mật khẩu không được để trống')" oninput="this.setCustomValidity('')">
            </div>
            <button type="submit" class="btn">Đăng Ký</button>
        </form>

        <div class="bottom-link">
            Đã có tài khoản? <a href="/login">Đăng nhập</a>
        </div>
        <div class="bottom-link" style="margin-top: 0.5rem;">
            <a href="/">← Quay lại Trang chủ</a>
        </div>
    </div>


</body>
</html>
