<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Tuấn Vi Vu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0ea5e9; --dark: #0f172a; --light: #f8fafc; --gray: #64748b; --sidebar: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { display: flex; min-height: 100vh; background-color: var(--light); color: var(--dark); }
        
        /* Sidebar */
        .sidebar { width: 260px; background-color: var(--sidebar); color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 2rem 1.5rem; font-size: 1.5rem; font-weight: 800; color: white; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-nav { flex-grow: 1; padding: 1.5rem 0; }
        .nav-item { display: block; padding: 1rem 1.5rem; color: #cbd5e1; text-decoration: none; font-weight: 500; transition: all 0.3s; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--primary); color: white; border-left: 4px solid #38bdf8; }
        .sidebar-footer { padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); }
        .sidebar-footer a { color: #ef4444; text-decoration: none; font-weight: 600; }
        
        /* Main Content */
        .main-content { flex-grow: 1; padding: 2.5rem; overflow-y: auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; }
        .page-title { font-size: 1.8rem; font-weight: 800; }
        
        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); border: 1px solid #f1f5f9; display: flex; flex-direction: column; }
        .stat-label { font-size: 0.9rem; color: var(--gray); font-weight: 600; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-val { font-size: 2rem; font-weight: 800; color: var(--dark); }
        .stat-val.primary { color: var(--primary); }
        .stat-val.warning { color: #f59e0b; }
        
        /* Recent Orders Section */
        .section-box { background: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); padding: 1.5rem; border: 1px solid #f1f5f9; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .section-title { font-size: 1.2rem; font-weight: 700; }
        .btn-sm { padding: 8px 16px; background: #e0f2fe; color: var(--primary); border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .btn-sm:hover { background: #bae6fd; }
        
        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 16px; color: var(--gray); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; }
        td { padding: 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: 700; }
        .status-PENDING { background: #fef3c7; color: #d97706; }
        .status-CONFIRMED { background: #dcfce7; color: #166534; }
        .status-CANCELED { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="/" class="sidebar-header">Tuấn Vi Vu Admin</a>
        <div class="sidebar-nav">
            <a href="/admin" class="nav-item active">📊 Dashboard</a>
            <a href="/admin/orders" class="nav-item">📝 Quản lý Đơn hàng</a>
            <a href="/admin/tours" class="nav-item">🏖️ Quản lý Tour</a>
        </div>
        <div class="sidebar-footer">
            <a href="/">← Quay lại Website</a>
        </div>
    </div>

    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">Tổng quan</h1>
            <span style="color: var(--gray); font-weight: 500;" th:text="${#calendars.format(#calendars.createNow(), 'dd/MM/yyyy HH:mm')}"></span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Doanh thu đã xác nhận</span>
                <span class="stat-val primary" th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Tổng Đơn hàng</span>
                <span class="stat-val" th:text="${totalOrders}">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Đơn chờ xử lý</span>
                <span class="stat-val warning" th:text="${pendingOrders}">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Tổng số Tour</span>
                <span class="stat-val" th:text="${totalTours}">0</span>
            </div>
        </div>

        <div class="section-box" style="margin-bottom: 2rem;">
            <div class="section-header">
                <h2 class="section-title">Doanh thu theo Tour</h2>
            </div>
            <div style="height: 350px;">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>

        <div class="section-box">
            <div class="section-header">
                <h2 class="section-title">Đơn hàng gần đây</h2>
                <a href="/admin/orders" class="btn-sm">Xem tất cả</a>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Mã Booking</th>
                        <th>Khách hàng</th>
                        <th>Tour</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${recentOrders.empty}">
                        <td colspan="5" style="text-align: center; color: var(--gray); padding: 2rem;">Chưa có đơn hàng nào</td>
                    </tr>
                    <tr th:each="order : ${recentOrders}">
                        <td><strong th:text="${order.orderCode}"></strong></td>
                        <td th:text="${order.fullName}"></td>
                        <td th:text="${order.tour.name}"></td>
                        <td th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 0, 'POINT')} + ' ₫'" style="font-weight: 600;"></td>
                        <td>
                            <span th:class="'status-badge status-' + ${order.status}" th:text="${order.status}">PENDING</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var revenueData = /*[[${revenueByTour}]]*/ {};
        
        var labels = Object.keys(revenueData);
        var data = Object.values(revenueData);
        
        var ctx = document.getElementById('revenueChart').getContext('2d');
        var myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Doanh thu (VNĐ)',
                    data: data,
                    backgroundColor: 'rgba(14, 165, 233, 0.6)',
                    borderColor: 'rgba(14, 165, 233, 1)',
                    borderWidth: 1,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(value);
                            }
                        }
                    }
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.parsed.y !== null) {
                                    label += new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(context.parsed.y);
                                }
                                return label;
                            }
                        }
                    }
                }
            }
        });
        /*]]>*/
    </script>
</body>
</html>
