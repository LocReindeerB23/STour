<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tour - Tuấn Vi Vu Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0ea5e9; --dark: #0f172a; --light: #f8fafc; --gray: #64748b; --sidebar: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { display: flex; min-height: 100vh; background-color: var(--light); color: var(--dark); }
        
        /* Sidebar */
        .sidebar { width: 260px; background-color: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 2rem 1.5rem; font-size: 1.5rem; font-weight: 800; color: white; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-nav { flex-grow: 1; padding: 1.5rem 0; }
        .nav-item { display: block; padding: 1rem 1.5rem; color: #cbd5e1; text-decoration: none; font-weight: 500; transition: all 0.3s; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--primary); color: white; border-left: 4px solid #38bdf8; }
        .sidebar-footer { padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); }
        .sidebar-footer a { color: #ef4444; text-decoration: none; font-weight: 600; }
        
        /* Main Content */
        .main-content { flex-grow: 1; padding: 2.5rem; overflow-y: auto; }
        .page-header { margin-bottom: 2.5rem; display: flex; justify-content: space-between; align-items: center; }
        .page-title { font-size: 1.8rem; font-weight: 800; }
        .btn-add { background: var(--primary); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
        .btn-add:hover { background: #0284c7; }
        
        .section-box { background: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); padding: 1.5rem; border: 1px solid #f1f5f9; }
        
        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 16px; color: var(--gray); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; }
        td { padding: 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: 700; }
        .status-Active { background: #dcfce7; color: #166534; }
        .status-Inactive { background: #fee2e2; color: #b91c1c; }

        .action-btns { display: flex; gap: 8px; }
        .btn-action { padding: 6px 12px; border: none; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: background 0.2s; text-decoration: none; display: inline-block; }
        .btn-edit { background: #e0f2fe; color: #0369a1; }
        .btn-edit:hover { background: #bae6fd; }
        .btn-delete { background: #fee2e2; color: #b91c1c; }
        .btn-delete:hover { background: #fecaca; }
        
        .empty-state { text-align: center; padding: 4rem; color: var(--gray); }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="/" class="sidebar-header">Tuấn Vi Vu Admin</a>
        <div class="sidebar-nav">
            <a href="/admin" class="nav-item">📊 Dashboard</a>
            <a href="/admin/orders" class="nav-item">📝 Quản lý Đơn hàng</a>
            <a href="/admin/tours" class="nav-item active">🏖️ Quản lý Tour</a>
        </div>
        <div class="sidebar-footer">
            <a href="/">← Quay lại Website</a>
        </div>
    </div>

    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">Danh sách Tour</h1>
            <a href="/admin/tours/new" class="btn-add">+ Thêm Tour Mới</a>
        </div>

        <div class="section-box">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên Tour</th>
                        <th>Danh mục</th>
                        <th>Ngày khởi hành</th>
                        <th>Giá (NL / TE)</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${tours.empty}">
                        <td colspan="7" class="empty-state">Chưa có tour nào trong hệ thống</td>
                    </tr>
                    <tr th:each="tour : ${tours}">
                        <td><strong th:text="${tour.id}" style="color: var(--primary);"></strong></td>
                        <td>
                            <div style="font-weight: 600;" th:text="${tour.name}"></div>
                            <div style="font-size: 0.85rem; color: var(--gray);" th:text="${tour.destination}"></div>
                        </td>
                        <td th:text="${tour.category}"></td>
                        <td th:text="${#temporals.format(tour.departureDate, 'dd/MM/yyyy')}"></td>
                        <td>
                            <div style="font-weight: 700; color: var(--dark);" th:text="${#numbers.formatDecimal(tour.priceAdult, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></div>
                            <div style="font-size: 0.8rem; color: var(--gray);" th:text="${#numbers.formatDecimal(tour.priceChildren, 0, 'COMMA', 0, 'POINT')} + ' ₫ (TE)'"></div>
                        </td>
                        <td>
                            <span th:class="'status-badge status-' + ${tour.status}" th:text="${tour.status}">Active</span>
                        </td>
                        <td>
                            <div class="action-btns">
                                <a th:href="@{/admin/tours/edit/{id}(id=${tour.id})}" class="btn-action btn-edit">Sửa</a>
                                <form th:if="${tour.status != 'Inactive'}" th:action="@{/admin/tours/delete/{id}(id=${tour.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn-action btn-delete" onclick="return confirm('Bạn có chắc chắn muốn ẩn tour này?');">Xóa/Ẩn</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
