<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ của tôi - Tuấn Vi Vu</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=2000') center/cover;
            color: white;
            padding: 60px 0;
            border-radius: 20px;
            margin-top: 20px;
        }
        .profile-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            border: 1px solid #f1f5f9;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="/"><i class="fa-solid fa-plane-departure me-2"></i>Tuấn Vi Vu</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link fw-medium" href="/">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link fw-medium" href="/tours">Khám phá</a></li>
        
        <li class="nav-item" th:if="${session.user != null}">
            <a class="nav-link fw-medium" href="/my-bookings">Chuyến đi của tôi</a>
        </li>
        
        <li class="nav-item ms-lg-3" th:if="${session.user == null}">
            <a class="btn btn-outline-primary rounded-pill px-4 me-2" href="/register">Đăng ký</a>
            <a class="btn btn-primary rounded-pill px-4" href="/login">Đăng nhập</a>
        </li>
        
        <li class="nav-item dropdown ms-lg-3" th:if="${session.user != null}">
            <a class="nav-link dropdown-toggle fw-bold text-dark active" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                <i class="fa-solid fa-circle-user me-1 text-primary"></i> <span th:text="${session.user.fullName}"></span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                <li><a class="dropdown-item fw-medium" href="/profile"><i class="fa-solid fa-user me-2"></i>Hồ sơ của tôi</a></li>
                <li><a class="dropdown-item text-danger fw-medium" href="/logout"><i class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất</a></li>
            </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mb-5 pb-5">
    <div class="hero-section text-center shadow-lg mb-5">
        <h2 class="display-6 fw-bold mb-2">Hồ sơ của tôi</h2>
        <p class="lead mb-0 px-3">Quản lý thông tin cá nhân của bạn</p>
    </div>

    <div class="profile-card">
        <div th:if="${successMessage}" class="alert alert-success fw-medium" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger fw-medium" th:text="${errorMessage}"></div>

        <form action="/profile" method="post">
            <div class="mb-3">
                <label for="email" class="form-label fw-medium">Email (Tên đăng nhập)</label>
                <input type="email" class="form-control" id="email" th:value="${user.email}" disabled readonly style="background-color: #f8fafc;">
                <div class="form-text">Email không thể thay đổi.</div>
            </div>
            
            <div class="mb-3">
                <label for="fullName" class="form-label fw-medium">Họ và tên</label>
                <input type="text" class="form-control" id="fullName" name="fullName" th:value="${user.fullName}" required>
            </div>
            
            <div class="mb-3">
                <label for="phone" class="form-label fw-medium">Số điện thoại</label>
                <input type="text" class="form-control" id="phone" name="phone" th:value="${user.phone}" required>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label fw-medium">Mật khẩu mới (Tùy chọn)</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Bỏ trống nếu không muốn đổi mật khẩu">
            </div>
            
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">Cập nhật thông tin</button>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white pt-5 pb-4 mt-5">
    <div class="container text-center">
        <div class="text-light opacity-50 small">
            &copy; 2026 Tuấn Vi Vu (Software Testing Edition). All rights reserved.
        </div>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
